[package]
name = "check4-net"
version = "0.1.0"
edition = "2021"
description = "Check4 peer-to-peer play: on-disk identity, live signed game sessions, iroh transport"
license = "MIT"

[dependencies]
check4-core = { path = "../check4-core" }
check4-protocol = { path = "../check4-protocol" }
iroh = "1.2"
iroh-tickets = "1"
iroh-mdns-address-lookup = "0.5"
n0-future = "0.3"
rand = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "sync", "time"] }

[dev-dependencies]
tempfile = "3"
