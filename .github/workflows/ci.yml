name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  ci:
    name: lint + test + differential fuzz
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: cargo-${{ runner.os }}-${{ hashFiles('rust/Cargo.lock') }}

      # TypeScript: the normative engine and the MCP server.
      - run: npm ci
      - run: npx eslint src/
      - run: npx jest

      # Rust: core replica, protocol, harness.
      - run: cargo fmt --manifest-path rust/Cargo.toml --check
      - run: cargo clippy --manifest-path rust/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path rust/Cargo.toml

      # The equivalence contract: both engines must trace byte-identically.
      - run: npm run fuzz:diff
